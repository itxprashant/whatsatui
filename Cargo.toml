[package]
name = "whatsatui"
version = "0.1.0"
edition = "2021"
description = "A beautiful terminal UI for WhatsApp via go-whatsapp-web-multidevice"
license = "MIT"

[dependencies]
ratatui = "0.30.1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
tiny_http = "0.12"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
block-padding = "0.3"
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }

[profile.release]
# Full LTO makes the final link step look "stuck" for minutes with no output.
lto = "thin"
strip = true
